<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ワードウルフ</title>
<style>
:root{
  --bg:#fff8ec;--card:#ffffff;--text:#2b2a33;--muted:#6b6878;--border:#ecdcc4;
  --primary:#ff7a45;--primary-text:#fff;--secondary:#ffe7d6;--secondary-text:#8a3a12;
  --citizen:#2f9e6e;--wolf:#6a4bd8;--warn:#e0464e;--chip:#fff1e2;--shadow:0 5px 0 rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a24;--card:#2a2735;--text:#f3f0fa;--muted:#b0aac2;--border:#3e3a4d;
    --primary:#ff8a5b;--primary-text:#1c1a24;--secondary:#3b3346;--secondary-text:#ffd2bd;
    --citizen:#4fd39a;--wolf:#a58bff;--warn:#ff6b72;--chip:#353041;--shadow:0 5px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a24;--card:#2a2735;--text:#f3f0fa;--muted:#b0aac2;--border:#3e3a4d;
  --primary:#ff8a5b;--primary-text:#1c1a24;--secondary:#3b3346;--secondary-text:#ffd2bd;
  --citizen:#4fd39a;--wolf:#a58bff;--warn:#ff6b72;--chip:#353041;--shadow:0 5px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","M PLUS Rounded 1c",system-ui,sans-serif;
  font-size:18px;line-height:1.8;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding-block:12px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:2.2rem;margin:.2em 0 .1em;text-align:center;letter-spacing:.05em}
h2{font-size:1.4rem;margin:.2em 0 .5em;text-align:center}
p{margin:.35em 0}
.sub{color:var(--muted);text-align:center;font-size:.95rem}
.left{text-align:left}
.card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
button{font:inherit;cursor:pointer;border:none;border-radius:16px;padding:12px 16px;font-weight:700;
  min-height:56px;line-height:1.6;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  transition:transform .08s ease}
button:active{transform:translateY(3px)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--wolf);outline-offset:2px}
.btn{display:block;width:100%;background:var(--primary);color:var(--primary-text);font-size:1.25rem;
  min-height:64px;padding-block:16px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.s2{background:var(--secondary);color:var(--secondary-text);font-size:1.05rem;min-height:56px;box-shadow:none}
.stack{display:grid;gap:12px;margin:12px 0}
.row{display:flex;gap:10px;align-items:stretch}
.row > *{flex:1;min-width:0}
.row > .fit{flex:0 0 auto}
.label{font-weight:800;margin-bottom:8px}
.bottom{position:sticky;bottom:0;z-index:5;margin-top:14px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bg);box-shadow:0 -10px 12px -10px rgba(0,0,0,.18)}
.bottom .btn{margin:0}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper button{width:64px;height:64px;padding:0;font-size:1.8rem;background:var(--secondary);color:var(--secondary-text);flex:0 0 auto}
.stepper .num{font-size:2.4rem;font-weight:800;min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
.stepper .num small{font-size:1rem;font-weight:700}
input[type=range]{width:100%;height:40px;accent-color:var(--primary);margin:6px 0 0}
input[type=text]{font:inherit;font-size:1.05rem;width:100%;min-height:52px;padding:10px 14px;border-radius:14px;
  border:2px solid var(--border);background:var(--bg);color:var(--text)}
input[type=text].bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--bg))}
.names{display:grid;gap:8px}
.names .row{align-items:center}
.names .row > span{flex:0 0 2.2em;font-weight:800;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{background:var(--chip);color:var(--text);border:2px solid var(--border);border-radius:16px;
  font-size:1rem;padding:8px 10px;min-height:54px;text-align:left}
.chip.on{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.tgrid .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.95rem;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere;min-height:70px}
.tgrid .ti{font-size:1.5rem;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{text-align:center;min-height:48px;border-radius:999px;padding:8px 14px}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{flex:1;min-height:46px;font-size:.95rem;background:var(--secondary);color:var(--secondary-text)}
.big{font-size:2.7rem;font-weight:800;text-align:center;margin:.2em 0;overflow-wrap:anywhere;line-height:1.3}
.who{font-size:2rem;font-weight:800;text-align:center;color:var(--primary);overflow-wrap:anywhere}
.emoji{font-size:3.6rem;text-align:center;line-height:1.2}
.timer{font-size:6rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:.1em 0}
.timer.low{color:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){.timer.low{animation:none}button{transition:none}}
.bar{height:14px;background:var(--chip);border-radius:999px;overflow:hidden;border:2px solid var(--border)}
.bar > div{height:100%;background:var(--primary);transition:width .25s linear}
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.players button{background:var(--chip);color:var(--text);border:3px solid var(--border);font-size:1.1rem;padding:12px 8px;overflow-wrap:anywhere;min-height:64px}
.players button.sel,.none.sel{border-color:var(--primary);background:var(--secondary)}
.none{width:100%;background:var(--chip);color:var(--text);border:3px dashed var(--border);margin-top:10px;min-height:64px}
.tag{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;font-weight:800;font-size:.95rem;overflow-wrap:anywhere}
.tag.c{background:var(--citizen)}.tag.w{background:var(--wolf)}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:2px dashed var(--border)}
.list li > span:first-child{min-width:0;overflow-wrap:anywhere}
.list li:last-child{border-bottom:none}
.hint{background:var(--chip);border-radius:14px;padding:10px 14px;font-size:.98rem}
.rules ol{padding-left:1.3em;margin:.3em 0}
.rules li{margin:.45em 0}
.cover{background:repeating-linear-gradient(45deg,var(--secondary),var(--secondary) 14px,var(--chip) 14px,var(--chip) 28px);
  border-radius:20px;padding:48px 16px;text-align:center;font-weight:800;font-size:1.3rem;color:var(--secondary-text)}
.pairs button{min-height:44px;padding:6px 12px;font-size:.95rem;background:var(--secondary);color:var(--secondary-text);flex:0 0 auto}
.score{font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.center{text-align:center}
.btn.back{width:auto;padding-inline:20px;white-space:nowrap}
.wolfrow{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;margin:6px 0 2px;line-height:1.2}
.win{font-size:2rem;font-weight:800;text-align:center}
.win.c{color:var(--citizen)}.win.w{color:var(--wolf)}.win.d{color:var(--muted)}
.tdisp{font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.tgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.tgrid4 button{padding:0;background:var(--secondary);color:var(--secondary-text);font-size:1.05rem}
.prog{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin:4px 0 10px}
.prog > div{height:100%;background:var(--primary)}
ruby{ruby-align:center}
rt{font-size:.48em;font-weight:600;line-height:1;letter-spacing:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--warn);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;
  max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toast[hidden]{display:none}
</style>
</head>
<body>
<main id="app"></main>

<script>
(() => {
// ============================================================
// ふりがな：「漢字{かんじ}」と書くと <ruby> になる。カタカナは自動でふりがなを付ける。
// ============================================================
const KATA = /[ァ-ヴ][ァ-ヴー]*/g;
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const KANJI_RB = /([一-鿿々]+)\{([ぁ-ゖー]+)\}/g;
function convText(s){
  return s.replace(KATA, m => `<ruby>${m}<rt>${toHira(m)}</rt></ruby>`)
          .replace(KANJI_RB, "<ruby>$1<rt>$2</rt></ruby>");
}
// タグの外（文字の部分）だけ変換する。属性の中は さわらない
const R = html => String(html).split(/(<[^>]*>)/).map((s,i) => i%2 ? s : convText(s)).join("");

// 数字つきの ことば（3人・1分30秒）の よみ
const D = ["","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
const tensPart = t => t ? (t>1 ? D[t] : "") + "じゅう" : "";
function ninKana(n){
  if(n===0) return "ぜろにん"; if(n===1) return "ひとり"; if(n===2) return "ふたり";
  const t = Math.floor(n/10), o = n%10;
  return tensPart(t) + (o===0 ? "" : o===4 ? "よ" : D[o]) + "にん";
}
const nin = n => `<ruby>${n}人<rt>${ninKana(n)}</rt></ruby>`;
function minKana(m){
  const t = Math.floor(m/10), o = m%10;
  if(o===0) return (t>1 ? D[t] : "") + "じゅっぷん";
  return tensPart(t) + {1:"いっぷん",2:"にふん",3:"さんぷん",4:"よんぷん",5:"ごふん",6:"ろっぷん",7:"ななふん",8:"はっぷん",9:"きゅうふん"}[o];
}
function secKana(s){
  if(s===0) return "ぜろびょう";
  return tensPart(Math.floor(s/10)) + (s%10 ? D[s%10] : "") + "びょう";
}
function fmtWord(s){
  const m = Math.floor(s/60), r = s%60, out = [];
  if(m > 0) out.push(`<ruby>${m}分<rt>${minKana(m)}</rt></ruby>`);
  if(r > 0 || m === 0) out.push(`<ruby>${r}秒<rt>${secKana(r)}</rt></ruby>`);
  return out.join("");
}
const fmtClock = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

// ---------- お題（言葉のペア） 15種類 ----------
const THEMES = {
  たべもの: { icon:"🍙", label:"食{た}べ物{もの}", pairs:[
    ["カレーライス","ハヤシライス"],["りんご","なし"],["ラーメン","うどん"],["おにぎり","おすし"],
    ["ケーキ","プリン"],["いちご","さくらんぼ"],["パン","ご飯{はん}"],["アイスクリーム","かき氷{ごおり}"],
    ["ハンバーガー","ホットドッグ"],["ピザ","グラタン"],["チョコレート","クッキー"],["みかん","バナナ"],
    ["からあげ","とんかつ"],["たまごやき","ゆでたまご"],["ぎゅうにゅう","ジュース"]]},
  どうぶつ: { icon:"🐶", label:"動物{どうぶつ}", pairs:[
    ["犬{いぬ}","ねこ"],["ライオン","トラ"],["パンダ","コアラ"],["うさぎ","ハムスター"],["ぞう","キリン"],
    ["ペンギン","アザラシ"],["イルカ","クジラ"],["カブトムシ","クワガタ"],["カラス","ハト"],
    ["さる","ゴリラ"],["カエル","カメ"],["ちょうちょ","とんぼ"]]},
  がっこう: { icon:"🏫", label:"学校{がっこう}", pairs:[
    ["体育{たいいく}","音楽{おんがく}"],["えんぴつ","ボールペン"],["消{け}しゴム","のり"],["ランドセル","リュック"],
    ["給食{きゅうしょく}","おべんとう"],["校庭{こうてい}","体育館{たいいくかん}"],["黒板{こくばん}","ホワイトボード"],
    ["運動会{うんどうかい}","遠足{えんそく}"],["じょうぎ","コンパス"],["ほけんしつ","図書室{としょしつ}"],["宿題{しゅくだい}","テスト"]]},
  あそび: { icon:"⚽", label:"遊{あそ}び", pairs:[
    ["おにごっこ","かくれんぼ"],["サッカー","バスケットボール"],["ブランコ","すべり台{だい}"],["なわとび","フラフープ"],
    ["トランプ","かるた"],["プール","海{うみ}"],["野球{やきゅう}","ドッジボール"],["ゲーム","マンガ"],
    ["つみ木{き}","ブロック"],["シャボン玉{だま}","風船{ふうせん}"]]},
  くらし: { icon:"🏠", label:"くらし", pairs:[
    ["夏休{なつやす}み","冬休{ふゆやす}み"],["クリスマス","お正月{しょうがつ}"],["かさ","レインコート"],["電車{でんしゃ}","バス"],
    ["遊園地{ゆうえんち}","動物園{どうぶつえん}"],["歯{は}みがき","おふろ"],["テレビ","タブレット"],["飛行機{ひこうき}","ヘリコプター"],
    ["雪{ゆき}","雨{あめ}"],["お祭{まつ}り","花火{はなび}大会{たいかい}"],["たんじょう日{び}","こどもの日{ひ}"],["自転車{じてんしゃ}","一輪車{いちりんしゃ}"]]},
  のりもの: { icon:"🚗", label:"乗{の}り物{もの}", pairs:[
    ["自転車{じてんしゃ}","バイク"],["船{ふね}","飛行機{ひこうき}"],["しんかんせん","ふつう電車{でんしゃ}"],["パトカー","きゅうきゅう車{しゃ}"],
    ["しょうぼう車{しゃ}","ごみしゅうしゅう車{しゃ}"],["タクシー","バス"],["トラック","ダンプカー"],
    ["ヘリコプター","ドローン"],["ボート","ヨット"],["ロケット","飛行機{ひこうき}"]]},
  おかし: { icon:"🍬", label:"おかし", pairs:[
    ["チョコレート","グミ"],["あめ","ガム"],["ポテトチップス","せんべい"],["ショートケーキ","ドーナツ"],
    ["アイスクリーム","ソフトクリーム"],["プリン","ゼリー"],["クッキー","ビスケット"],
    ["ホットケーキ","クレープ"],["わたあめ","りんごあめ"],["ラムネ","キャンディー"]]},
  "やさい・くだもの": { icon:"🥕", label:"野菜{やさい}・果物{くだもの}", pairs:[
    ["きゅうり","ナス"],["にんじん","大根{だいこん}"],["ピーマン","パプリカ"],["すいか","メロン"],
    ["ぶどう","もも"],["じゃがいも","さつまいも"],["キャベツ","レタス"],["かぼちゃ","とうもろこし"],
    ["ブロッコリー","カリフラワー"],["レモン","オレンジ"]]},
  スポーツ: { icon:"🏅", label:"スポーツ", pairs:[
    ["野球{やきゅう}","ソフトボール"],["水泳{すいえい}","ダイビング"],["テニス","バドミントン"],
    ["バスケットボール","バレーボール"],["ドッジボール","キックベース"],["マラソン","かけっこ"],
    ["スキー","スケート"],["じゅうどう","けんどう"],["サッカー","ラグビー"],["たっきゅう","テニス"]]},
  しぜん: { icon:"🌳", label:"自然{しぜん}", pairs:[
    ["山{やま}","海{うみ}"],["川{かわ}","池{いけ}"],["太陽{たいよう}","月{つき}"],["にじ","かみなり"],["風{かぜ}","台風{たいふう}"],
    ["森{もり}","林{はやし}"],["花{はな}","草{くさ}"],["すな","石{いし}"],["雪{ゆき}","氷{こおり}"],["雲{くも}","きり"]]},
  "きせつ・ぎょうじ": { icon:"🎍", label:"季節{きせつ}・行事{ぎょうじ}", pairs:[
    ["春{はる}","秋{あき}"],["夏{なつ}","冬{ふゆ}"],["お正月{しょうがつ}","七夕{たなばた}"],["ひなまつり","こどもの日{ひ}"],
    ["ハロウィン","クリスマス"],["入学式{にゅうがくしき}","卒業式{そつぎょうしき}"],["さくら","あじさい"],
    ["おおみそか","節分{せつぶん}"],["お花見{はなみ}","お月見{つきみ}"],["お年玉{としだま}","おこづかい"]]},
  おうちのもの: { icon:"🛋️", label:"おうちの物{もの}", pairs:[
    ["れいぞうこ","電子{でんし}レンジ"],["ソファ","いす"],["ふとん","まくら"],["せんたく機{き}","そうじ機{き}"],
    ["まど","ドア"],["カーテン","タオル"],["スプーン","フォーク"],["コップ","おちゃわん"],
    ["かがみ","時計{とけい}"],["電気{でんき}","ろうそく"]]},
  "ふく・もちもの": { icon:"👕", label:"服{ふく}・持{も}ち物{もの}", pairs:[
    ["くつ","長{なが}ぐつ"],["ぼうし","ヘルメット"],["マフラー","手{て}ぶくろ"],["Tシャツ","ワイシャツ"],
    ["ズボン","スカート"],["めがね","サングラス"],["かばん","さいふ"],["マスク","ハンカチ"],
    ["リュック","ポーチ"],["パジャマ","たいそう服{ふく}"]]},
  "がっき・おんがく": { icon:"🎹", label:"楽器{がっき}・音楽{おんがく}", pairs:[
    ["ピアノ","オルガン"],["ギター","バイオリン"],["たいこ","カスタネット"],["リコーダー","ハーモニカ"],
    ["歌{うた}","ダンス"],["ラジオ","テレビ"],["マイク","スピーカー"],["笛{ふえ}","トランペット"],
    ["ドラム","たいこ"],["コンサート","合唱{がっしょう}"]]},
  "しごと・おみせ": { icon:"🛒", label:"仕事{しごと}・お店{みせ}", pairs:[
    ["お医者{いしゃ}さん","かんごしさん"],["けいさつかん","しょうぼうし"],["パン屋{や}","ケーキ屋{や}"],
    ["コンビニ","スーパー"],["病院{びょういん}","歯医者{はいしゃ}"],["ゆうびんきょく","銀行{ぎんこう}"],
    ["魚屋{さかなや}","八百屋{やおや}"],["りようし","びようし"],["パイロット","運転手{うんてんしゅ}"],["本屋{ほんや}","図書館{としょかん}"]]},
};
const THEME_KEYS = Object.keys(THEMES);
const CUSTOM = "じぶんで";
const CUSTOM_LABEL = "自分{じぶん}で";
const MIN_P = 3, MAX_P = 40, MIN_S = 10, MAX_S = 3600;

// ---------- 保存 ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem("ww_"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("ww_"+k, JSON.stringify(v)); }catch(e){} },
};
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

// ---------- 状態 ----------
const S = {
  screen: "title", prev: "title",
  count: clamp(+store.get("count", 5) || 5, MIN_P, MAX_P),
  names: (() => { const n = store.get("names", []); return Array.isArray(n) ? n.map(String) : []; })(),
  themes: (() => {
    const t = store.get("themes", null);
    const ok = Array.isArray(t) ? t.filter(x => x===CUSTOM || THEMES[x]) : [];
    return ok.length || (Array.isArray(t) && t.length===0) ? ok : THEME_KEYS.slice();
  })(),
  custom: (() => { const c = store.get("custom", []); return Array.isArray(c) ? c : []; })(),
  secs: clamp(+store.get("secs", 180) || 180, MIN_S, MAX_S),
  wolves: Math.max(0, +store.get("wolves", 1) || 0),
  scores: {},
  game: null,
};
S.wolves = Math.min(S.wolves, S.count);
S.wolvesRandom = !!store.get("wolvesRandom", false);
const app = document.getElementById("app");
const $ = s => document.getElementById(s);

// ---------- 音・振動 ----------
let ac = null;
function beep(freq=660, dur=.15, times=1){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*(dur+.08);
      o.type="triangle"; o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.02);
    }
  }catch(e){}
}
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
let wake = null;
async function setWake(on){
  try{
    if(on){ if(!wake && navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); }
    else if(wake){ await wake.release(); wake = null; }

}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
function toast(html){
  let t = $("toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.setAttribute("role","alert"); document.body.appendChild(t); }
  t.innerHTML = R(html); t.hidden = false; clearTimeout(toast.h);
  toast.h = setTimeout(() => { t.hidden = true; }, 2800);
}
let timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function go(screen){ stopTimer(); S.screen = screen; setWake(screen==="talk"); render(); window.scrollTo(0,0); }
const themeLabel = t => t === CUSTOM ? CUSTOM_LABEL : THEMES[t].label;

function allPairs(){
  const out = [];
  for(const t of S.themes){
    if(t === CUSTOM) S.custom.forEach(p => out.push({theme:CUSTOM, pair:p}));
    else if(THEMES[t]) THEMES[t].pairs.forEach(p => out.push({theme:t, pair:p}));
  }
  return out;
}

function namesHtml(){

}
function validateNames(){
  const list = Array.from({length:S.count},(_,i)=>(S.names[i]||"").trim());
  const empty = list.findIndex(n => !n);
  const seen = new Map(); let dup = -1;
  list.forEach((n,i) => { if(n && dup<0){ if(seen.has(n)) dup = i; else seen.set(n,i); } });
  const bad = empty >= 0 ? empty : dup;
  if(bad < 0){ for(let i=0;i<S.count;i++) S.names[i] = list[i]; store.set("names", S.names); return true; }
  const el = app.querySelector(`[data-name="${bad}"]`);
  if(el){ el.classList.add("bad"); el.scrollIntoView({block:"center"}); el.focus({preventScroll:true}); }
  toast(empty >= 0 ? `${bad+1}番目{ばんめ}の名前{なまえ}を入{い}れてね` : `「${esc(list[bad])}」が${nin(2)}いるよ。ちがう名前{なまえ}にしてね`);
  return false;
}

}

// ---------- ゲーム開始 ----------
let lastPairKey = null;
function startGame(){
  const pool = allPairs();
  if(!pool.length){ toast("お題{だい}の種類{しゅるい}を1つ以上{いじょう}選{えら}んでね"); return; }
  let pick = pool[Math.random()*pool.length|0];
  if(pool.length > 1){ let n=0; while(pick.pair.join("/")===lastPairKey && n++<10) pick = pool[Math.random()*pool.length|0]; }
  lastPairKey = pick.pair.join("/");
  const flip = Math.random() < .5;
  const names = S.names.slice(0, S.count).map(n => n.trim());
  const wolfIdx = S.wolvesRandom
    ? names.map((_,i)=>i).filter(() => Math.random() < 1/3)
    : shuffle(names.map((_,i)=>i)).slice(0, clamp(S.wolves, 0, names.length));
  const wolves = wolfIdx.length;
  S.game = { names, theme:pick.theme, wolfIdx,
    citizenWord: flip ? pick.pair[1] : pick.pair[0], wolfWord: flip ? pick.pair[0] : pick.pair[1],
    turn:0, shown:false, picks:[], none:false, multi: S.wolvesRandom || wolves > 1, revealed:false, reversal:null, scored:false, more:false };
  names.forEach(n => { if(!(n in S.scores)) S.scores[n] = 0; });
  go("pass");
}

function outcome(g){
  const W = g.wolfIdx.length, N = g.names.length;
  if(W === N) return "allwolf";
  if(g.none) return W === 0 ? "nowolf-right" : "missed-none";
  if(W === 0) return "nowolf-wrong";
  const hit = g.picks.filter(i => g.wolfIdx.includes(i)).length;
  return hit * 3 >= g.picks.length ? "caught" : "missed";
}

    <div class="bottom row">
      <button class="btn s2" data-act="rev2" data-v="0">はずれ</button>
      <button class="btn" data-act="rev2" data-v="1">あたり！</button>
    </div>`;
  }
  let res;
  switch(kind){
    case "caught": res = g.reversal===true
      ? ["w","ウルフの勝{か}ち！","🐺🎉","ウルフがみんなの言葉{ことば}を当{あ}てた！ ぎゃくてん！"]
      : ["c","みんなの勝{か}ち！","🙌🎉", g.picks.length === 1 ? "ウルフを見{み}つけたよ！" : `選{えら}んだ${nin(g.picks.length)}のうち、ウルフは${nin(hit)}！（3分{ぶん}の1以上{いじょう}でみんなの勝{か}ち）`]; break;
    case "missed": {
      res = ["w","ウルフの勝{か}ち！","🐺🎉", g.picks.length === 1 ? `${accName}はウルフじゃなかった！`
        : hit === 0 ? "選{えら}んだ人{ひと}の中{なか}に、ウルフはいなかったよ！"
        : `選{えら}んだ${nin(g.picks.length)}のうち、ウルフは${nin(hit)}だけ。3分{ぶん}の1に足{た}りなかったよ！`]; break; }
    case "missed-none": res = ["w","ウルフの勝{か}ち！","🐺🎉","ほんとうはウルフがいたよ！"]; break;
    case "nowolf-right": res = ["c","みんなの勝{か}ち！","🙌🎉","ウルフはいなかったよ！ せいかい！"]; break;
    case "nowolf-wrong": res = ["d","引{ひ}き分{わ}け","😅",`${accName}はウルフじゃなかったよ。ほんとうはウルフはいなかったんだ`]; break;
    default: res = ["d","全員{ぜんいん}ウルフ！","🐺🐺🐺","みんな同{おな}じ言葉{ことば}だったよ。引{ひ}き分{わ}け！"];
  }
  if(!g.scored){
    g.scored = true;
    g.names.forEach((n,i)=>{
      const isW = g.wolfIdx.includes(i);
      if(res[0]==="w" && isW) S.scores[n] += 2;
      if(res[0]==="c" && !isW) S.scores[n] += 1;
    });
    beep(res[0]==="w"?440:880,.18,3); buzz([80,60,80]);
  }
  const W = g.wolfIdx.length, N = g.names.length;
  const ranking = g.names.map((n,i)=>[n,S.scores[n]||0,i]).sort((a,b)=>b[1]-a[1]||a[2]-b[2]);
  const shown = g.more ? ranking : ranking.slice(0,5);
  return `
  <div class="emoji">${res[2]}</div>
  <div class="win ${res[0]}">${res[1]}</div>
  ${W>0 ? `<div class="wolfrow" role="img" aria-label="ウルフは${W}人" style="font-size:${W<=5?"2.8rem":W<=12?"2.1rem":"1.6rem"}">${"<span>🐺</span>".repeat(W)}</div>` : ""}
  <p class="center">${res[3]}</p>
  <div class="card">
    ${W<N ? `<p class="center">みんなの言葉{ことば}<br><span class="tag c">${esc(g.citizenWord)}</span></p>` : ""}
    ${W>0 ? `<p class="center">ウルフの言葉{ことば}<br><span class="tag w">${esc(g.wolfWord)}</span></p>` : ""}
    <div class="label" style="margin-top:10px">🐺 ウルフは${nin(W)}だったよ</div>
    ${W===0 ? `<p class="sub left">ウルフはいなかったよ</p>` :
      `<ul class="list">${g.wolfIdx.slice().sort((a,b)=>a-b).map(i=>`<li><span>${esc(g.names[i])}</span><span class="tag w">ウルフ</span></li>`).join("")}</ul>
       ${W<N?`<p class="sub left">ほかの人{ひと}はみんな仲間{なかま}</p>`:""}`}
  </div>
  <div class="card">
    <div class="label">🏆 ポイント</div>
    <p class="sub left" style="margin-top:-4px">みんなの勝{か}ち＝仲間{なかま}+1 ／ ウルフの勝{か}ち＝ウルフ+2</p>
    <ul class="list">${shown.map(([n,s],k)=>`<li><span>${k+1}. ${esc(n)}</span><span class="score">${s}</span></li>`).join("")}</ul>
    ${ranking.length>5 ? `<button class="btn s2" data-act="more" style="margin-top:8px">${g.more?"へらす":`全員{ぜんいん}見{み}る（${nin(ranking.length)}）`}</button>` : ""}
  </div>
  <div class="bottom">
    <button class="btn" data-act="start">🔁 もう一度{いちど}遊{あそ}ぶ</button>
    <div class="row" style="margin-top:10px">
      <button class="btn s2" data-act="toSettings">⚙️ せってい</button>
      <button class="btn s2" data-act="toTitle">🏠 最初{さいしょ}</button>
    </div>
  </div>
  <button class="btn s2" data-act="resetScore" style="margin-top:6px">ポイントを0にする</button>`;
},
};

const QUESTIONS = [
  "それ、好{す}き？","どこで見{み}る？","何色{なにいろ}？","さわったことある？","毎日{まいにち}使{つか}う？",
  "大{おお}きさはどれくらい？","いつよく見{み}る？","おうちにある？","音{おと}はする？","食{た}べられる？",
  "夏{なつ}と冬{ふゆ}、どっちのイメージ？","大人{おとな}も好{す}き？","ねだんは高{たか}い？","一人{ひとり}でできる？",
];
let qIdx = 0;
const setQ = () => { $("q").innerHTML = R(QUESTIONS[qIdx % QUESTIONS.length]); };

// ---------- タイマー ----------
function paintTimer(){
  const g = S.game, el = $("timer"), bar = $("bar");
  if(!el) return;
  el.textContent = fmtClock(g.left);
  el.classList.toggle("low", g.left <= 10 && g.left > 0);
  bar.style.width = (100*g.left/g.total) + "%";
}
function startTick(){
  const g = S.game;
  paintTimer();
  stopTimer();
  g.endAt = Date.now() + g.left*1000;
  timerId = setInterval(() => {
    if(g.paused) return;
    const left = Math.max(0, Math.ceil((g.endAt - Date.now())/1000));
    if(left === g.left) return;
    g.left = left;
    if(left <= 5 && left > 0) beep(700,.08);
    paintTimer();
    if(left === 0){
      stopTimer(); beep(520,.4,3); buzz([300,100,300,100,300]);
      setTimeout(() => { if(S.screen==="talk") go("vote"); }, 1500);
    }
  }, 200);
}

// ---------- 描画 ----------
function render(){
  app.innerHTML = R(screens[S.screen]());
  if(S.screen === "talk"){ setQ(); startTick(); }
}

// ---------- 操作 ----------
app.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.name != null){ S.names[+t.dataset.name] = t.value; store.set("names", S.names); t.classList.remove("bad"); }
  else if(t.dataset.range === "count") setCount(+t.value);
  else if(t.dataset.range === "wolves") setWolves(+t.value);
});
app.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.dataset.name != null){
    e.preventDefault();
    const nx = app.querySelector(`[data-name="${+e.target.dataset.name+1}"]`);
    if(nx) nx.focus(); else e.target.blur();
  }
});

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  const a = b.dataset.act, g = S.game;
  switch(a){
    case "toPlayers": go("players"); break;
    case "toSettings": if(S.screen==="players" && !validateNames()) return; go("settings"); break;
    case "toRules": S.prev = S.screen; go("rules"); break;
    case "back": go(S.prev || "title"); break;
    case "toTitle": go("title"); break;
    case "toCustom": go("custom"); break;
    case "count": setCount(S.count + +b.dataset.d); break;
    case "wolves": setWolves(S.wolves + +b.dataset.d); break;
    case "wmode": S.wolvesRandom = b.dataset.v === "random"; store.set("wolvesRandom", S.wolvesRandom); render(); break;
    case "secs": setSecs(S.secs + +b.dataset.d); break;
    case "secsSet": setSecs(+b.dataset.v); break;
    case "theme": {
      const t = b.dataset.t;
      S.themes = S.themes.includes(t) ? S.themes.filter(x=>x!==t) : [...S.themes, t];
      store.set("themes", S.themes); render(); break;
    }
    case "themeAll": S.themes = [...THEME_KEYS, CUSTOM]; store.set("themes", S.themes); render(); break;
    case "themeNone": S.themes = []; store.set("themes", S.themes); render(); break;
    case "addPair": {
      const A = $("cA").value.trim(), B = $("cB").value.trim();
      if(!A || !B){ toast("言葉{ことば}を2つ入{い}れてね"); return; }
      if(A === B){ toast("ちがう言葉{ことば}を入{い}れてね"); return; }
      S.custom.push([A,B]); store.set("custom", S.custom); render(); break;
    }
    case "delPair": S.custom.splice(+b.dataset.i,1); store.set("custom", S.custom); render(); break;
    case "start": startGame(); break;
    case "show": g.shown = true; beep(880,.08); render(); window.scrollTo(0,0); break;
    case "hide": g.shown = false; g.turn++; go(g.turn >= g.names.length ? "ready" : "pass"); break;
    case "talk": g.total = S.secs; g.left = S.secs; g.paused = false; qIdx = Math.random()*QUESTIONS.length|0; go("talk"); break;
    case "nextQ": qIdx++; setQ(); break;
    case "pause":
      g.paused = !g.paused;
      if(!g.paused) g.endAt = Date.now() + g.left*1000;
      b.innerHTML = R(g.paused ? "▶ 続{つづ}ける" : "⏸ 止{と}める"); break;
    case "plus": g.left += 30; g.total = Math.max(g.total, g.left); g.endAt = Date.now() + g.left*1000; paintTimer(); break;
    case "toVote": go("vote"); break;
    case "accuse": {
      const i = +b.dataset.i;
      if(i === -1){ g.none = !g.none; if(g.none) g.picks = []; }
      else {
        g.none = false;
        if(!g.multi) g.picks = [i];
        else g.picks = g.picks.includes(i) ? g.picks.filter(x => x !== i) : [...g.picks, i];
      }
      render(); break; }
    case "judge": g.revealed = false; go("result"); break;
    case "reveal": g.revealed = true; beep(600,.12,2); render(); window.scrollTo(0,0); break;
    case "rev": g.reversal = b.dataset.v === "1" ? "check" : false; render(); break;
    case "rev2": g.reversal = b.dataset.v === "1"; render(); break;
    case "more": g.more = !g.more; render(); break;
    case "resetScore": Object.keys(S.scores).forEach(k=>S.scores[k]=0); render(); break;
  }
});

document.addEventListener("visibilitychange", () => { if(!document.hidden && S.screen==="talk") setWake(true); });
window.addEventListener("beforeunload", e => {
  if(S.game && ["pass","ready","talk","vote"].includes(S.screen)){ e.preventDefault(); e.returnValue=""; }
});

render();
})();
</script>
</body>
</html>
